<body>
    <section class="contact-section">
        <div class="container">
            <h1>Contact Us</h1>
            <p>Have a question or need help? Send us a message and we’ll get back to you as soon as possible.</p>

            <div class="contact-wrapper">
                <!-- Contact Form -->
                <form class="contact-form">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Your Name" required />

                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="your@email.com" required />

                    <label for="subject">Subject</label>
                    <input type="text" id="subject" placeholder="Message subject" required />

                    <label for="message">Message</label>
                    <textarea id="message" rows="5" placeholder="Write your message here..." required></textarea>

                    <button type="submit">Send Message</button>
                </form>

                <!-- Contact Info -->
                <div class="contact-info">
                    <h3>Our Office</h3>
                    <p><i class="fas fa-map-marker-alt"></i> 123 Street, New York, USA</p>
                    <p><i class="fas fa-phone"></i> +012 345 67890</p>
                    <p><i class="fas fa-envelope"></i> info&#64;example.com</p>

                    <h3>Follow Us</h3>
                    <div class="social-icons-enhanced">
                        <a href="#" class="social facebook" aria-label="Facebook">
                            <i class="fab fa-facebook-f"></i>
                        </a>
                        <a href="#" class="social twitter" aria-label="Twitter">
                            <i class="fab fa-twitter"></i>
                        </a>
                        <a href="#" class="social instagram" aria-label="Instagram">
                            <i class="fab fa-instagram"></i>
                        </a>
                        <a href="#" class="social linkedin" aria-label="LinkedIn">
                            <i class="fab fa-linkedin-in"></i>
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </section>
</body>
